name: Verify HI-Small
on:
  push:
    branches: [course/port-counts-factorial]
    paths: ['.github/workflows/verify-hi-small.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download pinned archive and verify all labels
        run: |
          curl --fail --location --silent --show-error -o hi.zip https://huggingface.co/datasets/eexzzm/IBM-Transactions-for-Anti-Money-Laundering-HI-Small-Trans/resolve/6412f57ab89c9c28633ce5e837eca4c9a35c5dbe/HI-Small_Trans.csv.zip
          echo '4407435ec99e37262294b3d4e317f3adcb8a89caa0df66927d1c6ba4f46e8080  hi.zip' | sha256sum -c
          python - <<'PY'
          import collections, csv, io, zipfile
          days = collections.defaultdict(lambda: [0, 0])
          with zipfile.ZipFile('hi.zip') as archive, archive.open('HI-Small_Trans.csv') as src:
              for row in csv.reader(io.TextIOWrapper(src)):
                  if row[0] == 'Timestamp':
                      continue
                  counts = days[row[0][:10]]
                  counts[0] += 1
                  counts[1] += int(row[-1])
          for day, counts in sorted(days.items()):
              print(day, *counts)
          total = [sum(pair[i] for pair in days.values()) for i in (0, 1)]
          assert total == [5078345, 5177], total
          print('Verified totals', *total)
          PY
